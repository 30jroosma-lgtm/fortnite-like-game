<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite-Like Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #menu {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            pointer-events: auto;
            z-index: 1000;
            flex-direction: column;
        }
        
        .menu-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 60px 80px;
            border-radius: 20px;
            border: 3px solid #00d4ff;
        }
        
        .menu-container h1 {
            color: #00d4ff;
            font-size: 72px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #00d4ff;
        }
        
        .menu-container p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 40px;
            max-width: 500px;
        }
        
        .menu-button {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            pointer-events: auto;
        }
        
        .menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00d4ff;
        }
        
        #gameUI {
            display: none;
            color: white;
            font-size: 16px;
            pointer-events: none;
        }
        
        #crosshair {
            position: absolute;
            width: 30px;
            height: 30px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        
        .crosshair-line {
            position: absolute;
            background: #00ff00;
        }
        
        .crosshair-h {
            width: 10px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .crosshair-v {
            width: 2px;
            height: 10px;
            top: 50%;
            left: 50%;
            transform: translateY(-50%);
        }
        
        #ammoDisplay {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            display: none;
        }
        
        #healthDisplay {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            display: none;
        }
        
        #weaponDisplay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #ffaa00;
            display: none;
        }
        
        .damage-indicator {
            position: absolute;
            color: #ff0000;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
        
        #minimap {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            display: none;
        }
        
        #inventory {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            display: none;
            max-width: 300px;
        }
        
        .inventory-slot {
            padding: 8px 12px;
            margin: 5px 0;
            background: rgba(0, 100, 200, 0.3);
            border-radius: 5px;
            color: #00d4ff;
            font-size: 14px;
        }
        
        #shopMenu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #00d4ff;
            border-radius: 20px;
            padding: 40px;
            z-index: 2000;
            pointer-events: auto;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .shop-title {
            color: #00d4ff;
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .shop-item {
            background: rgba(0, 100, 200, 0.2);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .shop-item-info {
            flex: 1;
        }
        
        .shop-item-name {
            color: #00d4ff;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .shop-item-price {
            color: #ffaa00;
            font-size: 16px;
        }
        
        .shop-buy-btn {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 15px;
            pointer-events: auto;
        }
        
        .shop-buy-btn:hover {
            box-shadow: 0 0 15px #00d4ff;
        }
        
        .shop-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff0000;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            pointer-events: auto;
        }
        
        .coins-display {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffaa00;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            display: none;
        }
        
        #dropInfo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            display: none;
            pointer-events: none;
            font-size: 18px;
        }
        
        #buildModeUI {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #ffaa00;
            color: #ffaa00;
            display: none;
            font-size: 16px;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #00d4ff;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="menu">
            <div class="menu-container">
                <h1>BATTLE ROYALE</h1>
                <p>Drop from the plane, scavenge for weapons, and be the last player standing!</p>
                <button class="menu-button" onclick="startGame()">START GAME</button>
                <button class="menu-button" onclick="openShop()">SHOP</button>
            </div>
        </div>
        
        <div id="gameUI">
            <div id="dropInfo"></div>
            <div id="crosshair">
                <div class="crosshair-line crosshair-h"></div>
                <div class="crosshair-line crosshair-v"></div>
            </div>
            <div id="inventory"></div>
            <div class="coins-display" id="coinsDisplay">Coins: 0</div>
            <div id="healthDisplay">Health: 100</div>
            <div id="ammoDisplay">Ammo: 0</div>
            <div id="weaponDisplay">Weapon: None</div>
            <div id="minimap"></div>
            <div id="buildModeUI">BUILD MODE - R: Ramp | B: Wall | Click: Build | E: Cancel</div>
            <div class="controls-hint" id="controlsHint">Mouse to aim • WASD to move • Space to jump • E to interact • R to build mode</div>
        </div>
        
        <div id="shopMenu">
            <button class="shop-close-btn" onclick="closeShop()">×</button>
            <div class="shop-title">COSMETICS SHOP</div>
            <div id="shopItems"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
